name: Publish to GitHub Pages

# Copies site/ onto the gh-pages branch whenever the default branch changes,
# including archive edits committed from the debug dashboard. Pages serves
# gh-pages directly ("Deploy from a branch").
on:
  push:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy site/ into the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add --detach ../pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages ../pages
          fi
          rsync -a --delete --exclude .git site/ ../pages/
          touch ../pages/.nojekyll
          cd ../pages
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages is already up to date."
            exit 0
          fi
          git commit -m "Publish site ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
