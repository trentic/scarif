<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04060a">
  <title>Scarif · Debug</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="top">
    <a class="brand" href="../">SCARIF <span>// debug</span></a>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <main id="app" class="wrap"></main>
  <div id="toasts" aria-live="polite"></div>
  <script>
    // Loads scripts and styles as file?v=<hash> (from version.json), so the
    // browser always fetches a file again once it changes. An import map does
    // the same for every module the entry script imports.
    (async () => {
      const root = new URL('../', location.href);
      let info = { files: {} };
      try { info = await (await fetch(new URL(`version.json?t=${Date.now()}`, root), { cache: 'no-store' })).json(); } catch {}
      window.SCARIF_VERSION = info.v || null;
      const url = (p) => new URL(p, root).href + (info.files?.[p] ? `?v=${info.files[p]}` : '');
      const imports = {};
      for (const p of Object.keys(info.files || {})) if (p.endsWith('.js')) imports[new URL(p, root).href] = url(p);
      document.head.append(Object.assign(document.createElement('script'), { type: 'importmap', textContent: JSON.stringify({ imports }) }));
      await Promise.all(['css/theme.css', 'debug/debug.css'].map((p) => new Promise((done) => {
        document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: url(p), onload: done, onerror: done }));
      })));
      import(new URL('debug/debug.js', root).href);
    })();
  </script>
</body>
</html>
